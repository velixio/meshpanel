# nginx in front of headscale (127.0.0.1:8080) and meshpanel (127.0.0.1:8030).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name headscale.example.com;

    ssl_certificate     /etc/letsencrypt/live/headscale.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/headscale.example.com/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Phone sign-in pages and the dashboard → meshpanel.
    location ~ ^/(register|auth)/ {
        proxy_pass http://127.0.0.1:8030;
    }
    location /admin {
        proxy_pass http://127.0.0.1:8030;
        proxy_read_timeout 1h;   # live-update WebSocket
    }

    # Everything else → headscale (Tailscale control protocol, DERP, API).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name headscale.example.com;
    return 301 https://$host$request_uri;
}

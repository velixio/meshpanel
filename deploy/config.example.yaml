# meshpanel configuration. Every key can also be set with an environment
# variable: MESHPANEL_<SECTION>_<KEY>, e.g. MESHPANEL_SERVER_LISTEN=":8030".

server:
  # Address meshpanel listens on. Plain HTTP: put your reverse proxy in front.
  listen: ":8030"
  # Dashboard prefix. /register/* and /auth/* are always served at the root.
  base_path: "/admin"
  # The public URL phones use (same as headscale's server_url).
  public_url: "https://headscale.example.com"
  # Mark cookies Secure. Keep true behind an HTTPS proxy; set false only for
  # a plain-HTTP LAN trial.
  cookie_secure: true
  # Only these proxies may set X-Forwarded-For. CIDRs or single IPs.
  trusted_proxies: ["127.0.0.1/32", "::1/128"]
  # Optional. Left unset, meshpanel generates a random secret on first start
  # and keeps it as `session_secret` next to the database. To choose your own:
  # openssl rand -hex 32   (or point session_secret_path at a file).
  # It also encrypts stored 2FA secrets: changing it later means every
  # account has to set up 2FA again (meshpanel user reset-2fa NAME).
  # session_secret: ""
  # session_secret_path: /etc/meshpanel/session_secret

headscale:
  # headscale 0.29.x has no HTTP API on its socket: create a key with
  #   headscale apikeys create --expiration 999d
  # and set it here (or api_key_path). With a key, meshpanel uses headscale's
  # REST API at http_url instead of the socket. headscale 0.30+ needs no key.
  # api_key: ""
  # api_key_path: /etc/meshpanel/headscale_api_key
  # headscale's unix socket. meshpanel's user must be in the socket's group.
  socket: "/var/run/headscale/headscale.sock"
  # headscale's local HTTP listener: reads /version, and serves the REST API when api_key is set.
  http_url: "http://127.0.0.1:8080"
  # headscale's config.yaml. Needed for DNS editing; leave empty to disable.
  config_path: "/etc/headscale/config.yaml"
  # Policy file, when headscale runs with policy.mode: file.
  policy_path: ""
  # headscale binary, used for `headscale configtest` before applying changes.
  binary: "headscale"
  # Commands that apply changes. See deploy/sudoers for the matching rule.
  reload_command: "sudo systemctl reload headscale"
  restart_command: "sudo systemctl restart headscale"
  # How often meshpanel reads node state from headscale.
  poll_interval: 5s

db:
  path: "/var/lib/meshpanel/meshpanel.db"

telegram:
  # Bot token from @BotFather. Leave empty to disable Telegram.
  token: ""
  # token_path: /etc/meshpanel/telegram_token
  # Optional group chat that also receives approval cards (negative id).
  group_chat_id: 0

# Optional: a small tailnet node that reads each machine's OS, Tailscale
# version and endpoints. It joins as headscale user `hs_user` (created if
# missing). With a restrictive policy, let it see peers, e.g.:
#   {"action": "accept", "src": ["meshpanel@"], "dst": ["*:*"], "proto": "icmp"}
agent:
  enabled: false
  hs_user: "meshpanel"
  hostname: "meshpanel"
  # control_url: ""          # default: headscale.http_url
  # state_dir: ""            # default: <db dir>/tailnet/agent
  interval: 1m

# Optional: SSH terminals in the browser. Each session joins the tailnet as
# the signed-in person's own headscale user (an ephemeral node, deleted when
# the session closes), so Tailscale SSH policy applies to them personally.
web_ssh:
  enabled: false
  max_sessions: 10
  max_per_user: 3
  default_user: "root"

log:
  level: "info"
